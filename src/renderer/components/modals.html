<!-- Add Task Modal -->
<div class="modal-overlay" id="modal-overlay" style="display: none">
  <div class="modal glass" id="modal-add-task">
    <div class="modal-header">
      <h2 id="modal-title">Add Task</h2>
      <button class="btn btn-close-modal" id="btn-modal-close">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <form id="form-add-task">
      <div class="form-group">
        <label for="task-name">Task Name</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <input type="text" id="task-name" placeholder="What are you working on?" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="task-date">Date</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <input type="date" id="task-date" required />
          </div>
        </div>
        <div class="form-group">
          <label for="task-time">Time</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <input type="time" id="task-time" required />
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="task-priority">Priority</label>
        <select id="task-priority" class="select-input" style="display: none">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <div class="priority-selector" id="task-priority-selector">
          <button type="button" class="priority-pill pill-low" data-value="low">
            <span class="dot"></span>Low
          </button>
          <button type="button" class="priority-pill pill-medium active" data-value="medium">
            <span class="dot"></span>Medium
          </button>
          <button type="button" class="priority-pill pill-high" data-value="high">
            <span class="dot"></span>High
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="task-estimate">Estimated Duration</label>
        <div class="duration-input-container">
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 10"></polyline>
            </svg>
            <input type="number" id="task-estimate" min="1" max="480" placeholder="60 minutes" />
          </div>
          <div class="duration-presets" id="task-duration-presets">
            <button type="button" class="preset-btn" data-value="15">15m</button>
            <button type="button" class="preset-btn" data-value="30">30m</button>
            <button type="button" class="preset-btn" data-value="60">1h</button>
            <button type="button" class="preset-btn" data-value="90">1.5h</button>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="task-notes">Notes (Optional)</label>
        <div class="input-wrapper input-wrapper-textarea">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <textarea id="task-notes" rows="3" placeholder="Add notes, checklists, links, or details..." class="textarea-input"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="btn-cancel-task">Cancel</button>
        <button type="submit" class="btn btn-accent-gradient">Save Task</button>
      </div>
    </form>
  </div>
</div>

        <div class="input-wrapper input-wrapper-textarea">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <textarea id="edit-entry-notes" rows="3" placeholder="Notes on this session..." class="textarea-input"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="btn-edit-entry-cancel">Cancel</button>
        <button type="submit" class="btn btn-accent-gradient">Update Entry</button>
      </div>
    </form>
  </div>
</div>

<!-- Fullscreen Timer Overlay -->
<div class="fullscreen-timer-overlay" id="fullscreen-timer-overlay" style="display: none">
  <button class="fullscreen-close-btn" id="btn-fullscreen-close" title="Exit Fullscreen">✕</button>
  <div class="fullscreen-timer-content">
    <div class="fullscreen-task-name" id="fullscreen-task-name">No task selected</div>
    <div class="fullscreen-timer-display" id="fullscreen-timer-display">00:00:00</div>
    <div class="fullscreen-timer-hint">Press ESC to exit fullscreen</div>
  </div>
</div>

<!-- Global Target Modal -->
<div class="modal-overlay" id="global-target-modal-overlay" style="display: none">
  <div class="modal glass modal-sm">
    <div class="modal-header">
      <h2>Set Overall Weekly Target</h2>
      <button class="btn btn-close-modal" id="btn-global-target-close">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <form id="form-global-target">
      <div class="form-group">
        <label for="global-target-hours">Weekly Target Hours</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
          <input type="number" id="global-target-hours" min="0" max="168" step="0.5" placeholder="e.g. 40" />
        </div>
      </div>
      <div class="form-actions" style="justify-content: space-between">
        <button type="button" class="btn btn-ghost" id="btn-global-target-delete" style="color: var(--accent-pink); border-color: rgba(255, 107, 138, 0.2);">
          Delete Target
        </button>
        <div style="display: flex; gap: var(--space-sm)">
          <button type="button" class="btn btn-ghost" id="btn-global-target-cancel">Cancel</button>
          <button type="submit" class="btn btn-accent-gradient">Save Target</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Task Notes Modal -->
<div class="modal-overlay" id="task-notes-modal-overlay" style="display: none">
  <div class="modal glass modal-md" id="modal-task-notes">
    <div class="modal-header">
      <div>
        <h2>Task Notes</h2>
        <p class="modal-subtitle" id="task-notes-modal-subtitle" style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">Notes & details for this task</p>
      </div>
      <button class="btn btn-close-modal" id="btn-task-notes-close">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <form id="form-task-notes">
      <input type="hidden" id="task-notes-id" />
      <div class="form-group">
        <div class="input-wrapper input-wrapper-textarea">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <textarea id="task-notes-content" rows="8" placeholder="Type your notes, checklist, links, steps or reminders here..." class="textarea-input" style="min-height: 180px; font-size: 13.5px;"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="btn-task-notes-cancel">Cancel</button>
        <button type="submit" class="btn btn-accent-gradient">Save Notes</button>
      </div>
    </form>
  </div>
</div>
