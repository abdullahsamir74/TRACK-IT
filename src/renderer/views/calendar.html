<section id="view-calendar" class="view">
  <div class="view-header">
    <h1>Calendar</h1>
  </div>

  <!-- Month Navigation -->
  <div class="cal-header">
    <button class="cal-nav-btn" id="cal-prev-month" title="Previous Month">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <div class="cal-title-group">
      <span class="cal-month-title" id="cal-month-title">August 2026</span>
    </div>
    <button class="cal-today-btn" id="cal-today-btn">Today</button>
    <button class="cal-nav-btn" id="cal-next-month" title="Next Month">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- Weekday Headers -->
  <div class="cal-weekdays" id="cal-weekdays">
    <div class="cal-weekday">Sun</div>
    <div class="cal-weekday">Mon</div>
    <div class="cal-weekday">Tue</div>
    <div class="cal-weekday">Wed</div>
    <div class="cal-weekday">Thu</div>
    <div class="cal-weekday">Fri</div>
    <div class="cal-weekday">Sat</div>
  </div>

  <!-- Days Grid -->
  <div class="cal-days-grid" id="cal-days-grid"></div>

  <!-- Day Detail Panel -->
  <div class="cal-detail-panel" id="cal-detail-panel">
    <div class="cal-detail-header">
      <div class="cal-detail-date" id="cal-detail-date">Select a day</div>
      <button class="btn btn-accent btn-sm" id="cal-add-task-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Task
      </button>
    </div>
    <div class="cal-detail-tasks" id="cal-detail-tasks">
      <div class="cal-detail-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <p>Click a day to view its tasks</p>
      </div>
    </div>
  </div>
</section>
