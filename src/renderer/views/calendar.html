<section id="view-calendar" class="view week-view">
  <div class="view-header week-header">
    <h1>Calendar</h1>
    <div class="week-controls">
      <button class="btn btn-ghost btn-sm" id="week-prev" title="Previous week">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="week-title-group">
        <span class="week-title" id="week-title">Week</span>
      </div>
      <button class="btn btn-ghost btn-sm" id="week-today">Today</button>
      <button class="btn btn-ghost btn-sm" id="week-next" title="Next week">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <div class="week-grid">
    <div class="week-gutter"></div>
    <div class="week-header-row" id="week-header-row"></div>
  </div>

  <div class="week-scroll" id="week-scroll">
    <div class="week-grid-body">
      <div class="time-axis" id="time-axis"></div>
      <div class="week-columns" id="week-columns"></div>
    </div>
  </div>
</section>
