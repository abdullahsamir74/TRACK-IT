<section id="view-projects" class="view">
  <div class="view-header">
    <div class="header-left">
      <h1>Projects</h1>
      <p class="view-subtitle">Group and prioritize your tasks into color-coded projects</p>
    </div>
    <div class="view-actions">
      <button class="btn btn-accent" id="btn-new-project">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Create Project
      </button>
    </div>
  </div>

  <!-- Compact Unassigned Tasks Drawer -->
  <div class="kanban-unassigned-drawer glass" id="unassigned-pool-panel">
    <div class="kanban-unassigned-header" id="unassigned-drawer-header">
      <div class="kanban-unassigned-title-group">
        <div class="kanban-unassigned-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          </svg>
        </div>
        <span class="kanban-unassigned-label">Unassigned Tasks</span>
        <span class="badge" id="unassigned-tasks-count">0</span>
      </div>
      <div class="kanban-unassigned-chevron" id="unassigned-chevron">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>
    </div>
    <div class="kanban-unassigned-body">
      <div class="kanban-unassigned-scroll" id="unassigned-tasks-pool" data-project-id="unassigned">
        <!-- Unassigned task cards -->
      </div>
    </div>
  </div>

  <!-- Kanban Board -->
  <div class="kanban-board" id="kanban-board">
    <div class="kanban-columns" id="projects-list-stack">
      <!-- Dynamically rendered Kanban columns -->
    </div>
  </div>
</section>
