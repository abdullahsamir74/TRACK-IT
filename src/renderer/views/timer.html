<section id="view-timer" class="view">
  <div class="view-header">
    <div>
      <h1>Focus Timer</h1>
      <p class="view-subtitle">Track deep work sessions and Pomodoro focus blocks</p>
    </div>
  </div>
  <div class="timer-container">
    <div class="timer-mode-switcher">
      <button type="button" class="timer-mode-btn active" data-mode="stopwatch">Stopwatch</button>
      <button type="button" class="timer-mode-btn" data-mode="pomodoro">Pomodoro Focus</button>
    </div>

    <div class="pomodoro-presets" id="pomodoro-presets" style="display: none;">
      <button type="button" class="pomo-preset-btn active" data-focus="25" data-break="5">25m / 5m</button>
      <button type="button" class="pomo-preset-btn" data-focus="50" data-break="10">50m / 10m</button>
      <button type="button" class="pomo-preset-btn" data-focus="15" data-break="3">15m / 3m</button>
    </div>

    <div class="timer-ring-wrapper">
      <svg class="timer-ring" viewBox="0 0 200 200">
        <circle
          class="timer-ring-bg"
          cx="100"
          cy="100"
          r="90"
          fill="none"
          stroke-width="6"
        />
        <circle
          class="timer-ring-progress"
          cx="100"
          cy="100"
          r="90"
          fill="none"
          stroke-width="6"
          stroke-dasharray="565.48"
          stroke-dashoffset="565.48"
          transform="rotate(-90 100 100)"
        />
      </svg>
      <div class="timer-display">
        <div class="pomodoro-phase-badge" id="pomodoro-phase-badge" style="display: none;">FOCUS SESSION</div>
        <span class="timer-time" id="timer-display">00:00:00</span>
        <span class="timer-task-name" id="timer-task-name">No task selected</span>
      </div>
    </div>

    <div
      class="timer-estimate-bar"
      id="timer-estimate-bar"
      style="display: none"
    >
      <div class="estimate-bar-labels">
        <span>Elapsed</span>
        <span id="timer-estimate-label">Est: 0min</span>
      </div>
      <div class="estimate-bar-track">
        <div class="estimate-bar-fill" id="timer-estimate-fill"></div>
      </div>
    </div>

    <div class="timer-controls">
      <button
        class="timer-btn timer-btn-secondary"
        id="btn-timer-stop"
        disabled
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2" />
        </svg>
      </button>
      <button class="timer-btn timer-btn-primary" id="btn-timer-start">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="currentColor"
          id="timer-play-icon"
        >
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="currentColor"
          id="timer-pause-icon"
          style="display: none"
        >
          <rect x="6" y="4" width="4" height="16" rx="1" />
          <rect x="14" y="4" width="4" height="16" rx="1" />
        </svg>
      </button>
    </div>

    <div class="timer-task-notes-card" id="timer-task-notes-card" style="display: none;">
      <div class="timer-task-notes-header">
        <div class="timer-task-notes-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span>Task Notes</span>
        </div>
        <button type="button" class="btn-timer-edit-notes" id="btn-timer-edit-notes" title="View / Edit task notes">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          Edit Notes
        </button>
      </div>
      <div class="timer-task-notes-body" id="timer-task-notes-body"></div>
    </div>

    <div class="timer-task-selector" id="timer-task-selector">
      <h3>Select a task to track</h3>
      <div class="timer-task-list" id="timer-task-list"></div>
    </div>
  </div>
</section>
